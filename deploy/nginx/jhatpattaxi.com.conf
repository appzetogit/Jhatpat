server {
    server_name jhatpattaxi.com www.jhatpattaxi.com;

    root /var/www/jhatpattaxi;
    index index.html;

    client_max_body_size 30m;

    location / {
        try_files $uri $uri/index.html /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:5040;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_cache_bypass $http_upgrade;
    }

    location /uploads/ {
        alias /var/www/jhatpat-uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location /health {
        proxy_pass http://127.0.0.1:5040/health;
        proxy_set_header Host $host;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/jhatpattaxi.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/jhatpattaxi.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = www.jhatpattaxi.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = jhatpattaxi.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name jhatpattaxi.com www.jhatpattaxi.com;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot
}
